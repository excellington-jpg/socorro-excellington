<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socorro Excellington</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --red-btn: #d32f2f;
            --orange-btn: #f57c00;
            --yellow-btn: #fbc02d;
            --green-btn: #388e3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #fff;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .btn-config {
            background: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            width: 100%;
        }

        .btn-config:hover {
            background: #555;
        }

        .emergency-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .panic-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }

        .panic-btn:active {
            transform: scale(0.97);
        }

        .btn-red { background-color: var(--red-btn); }
        .btn-orange { background-color: var(--orange-btn); color: #000; }
        .btn-yellow { background-color: var(--yellow-btn); color: #000; }

        #status-box {
            margin-top: 20px;
            padding: 12px;
            background: #252525;
            border-radius: 6px;
            font-size: 0.85rem;
            border-left: 4px solid #777;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel { background: #555; color: white; }
        .btn-send { background: var(--green-btn); color: white; }

        .recording-indicator {
            color: #ff5252;
            font-weight: bold;
            animation: blink 1s infinite;
            display: inline-block;
            margin-left: 5px;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Socorro Excellington</h1>
        <div class="subtitle">Sistema de Alerta SMS e Geolocalização</div>

        <div class="section">
            <label for="smsInput">Número de SMS de Emergência (com DDI e DDD):</label>
            <input type="text" id="smsInput" placeholder="Ex: 5531999999999">
            <button class="btn-config" onclick="saveConfig()">Salvar Configuração</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <div class="emergency-grid">
            <button class="panic-btn btn-red" onclick="triggerRedAlert()">🔴 Perigo Iminente</button>
            <button class="panic-btn btn-orange" onclick="openModal('orange')">🟠 Acidente</button>
            <button class="panic-btn btn-yellow" onclick="openModal('yellow')">🟡 Pane / Ataque</button>
        </div>

        <div id="status-box"></div>
    </div>

    <div id="customModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Informações Adicionais</h3>
            <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">Descreva o ocorrido ou dite por voz (respeitando o limite de SMS).</p>
            <textarea id="additionalInfo" rows="4" placeholder="Ex: Meu carro quebrou na rodovia..."></textarea>
            
            <button class="btn-config" id="recordVoiceBtn" onclick="toggleVoiceTranscription()" style="margin-bottom: 10px;">🎙️ Ditar por Voz (Transcrição)</button>
            <span id="voiceStatus" style="font-size: 0.8rem; display:block; margin-bottom: 10px;">Aguardando comando de voz.</span>

            <div class="modal-buttons">
                <button class="btn-action btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-action btn-send" onclick="sendCustomAlert()">Enviar SMS</button>
            </div>
        </div>
    </div>

    <script>
        const SMS_LIMIT = 160;
        let currentMode = '';
        let redAlertInterval = null;
        let recognition = null;

        window.onload = function() {
            const savedSMS = localStorage.getItem('excellington_sms');
            if (savedSMS) {
                document.getElementById('smsInput').value = savedSMS;
            }
            requestPermissionsEarly();
        };

        function saveConfig() {
            const smsNumber = document.getElementById('smsInput').value.trim();
            localStorage.setItem('excellington_sms', smsNumber);
            showStatus("Número de SMS salvo com sucesso!", "green");
        }

        async function requestPermissionsEarly() {
            try {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(() => {}, () => {}, {maximumAge: 60000, timeout: 5000});
                }
            } catch (e) {
                console.log("Permissão prévia de geolocalização pendente.");
            }
        }

        function showStatus(text, color = "#777") {
            const box = document.getElementById('status-box');
            box.style.display = "block";
            box.style.borderLeftColor = color;
            box.innerHTML = text;
        }

        function removerAcentos(texto) {
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function criarMensagemSMS(tipo, localizacao, textoVoz = '') {
            let base = '';
            const locFormatada = removerAcentos(localizacao);
            const vozFormatada = removerAcentos(textoVoz);

            switch (tipo) {
                case 'perigo':
                    base = `SOCORRO! Perigo iminente. Local: ${locFormatada}. Ajuda urgente!`;
                    break;
                case 'orange':
                    base = `Alerta ACIDENTE: ${vozFormatada}. Local: ${locFormatada}`;
                    break;
                case 'yellow':
                    base = `Alerta PANE: ${vozFormatada}. Local: ${locFormatada}`;
                    break;
                default:
                    base = `Alerta Socorro Excellington. Local: ${locFormatada}`;
            }

            if (base.length > SMS_LIMIT) {
                const excesso = base.length - SMS_LIMIT;
                const tamanhoDisponivelVoz = vozFormatada.length - excesso;
                
                if (tamanhoDisponivelVoz > 0) {
                    const vozReduzida = vozFormatada.substring(0, tamanhoDisponivelVoz - 3) + '...';
                    return criarMensagemSMS(tipo, localizacao, vozReduzida);
                } else {
                    base = base.substring(0, SMS_LIMIT - 3) + '...';
                }
            }

            return base;
        }

        function triggerRedAlert() {
            const smsNumber = localStorage.getItem('excellington_sms');
            if (!smsNumber) {
                alert("Configure o número de SMS de emergência antes de usar.");
                return;
            }

            if (!confirm("ATENÇÃO: Você acionará o alerta máximo de PERIGO via SMS. Deseja prosseguir?")) return;

            showStatus("🚨 ALERTA DE PERIGO ATIVADO! Obtendo localização...", "#d32f2f");
            
            executeRedAlertCycle(smsNumber);

            if (redAlertInterval) clearInterval(redAlertInterval);
            redAlertInterval = setInterval(() => {
                executeRedAlertCycle(smsNumber);
            }, 300000);
        }

        async function executeRedAlertCycle(smsNumber) {
            try {
                const locationUrl = await getLocation();
                sendSMS(smsNumber, 'perigo', locationUrl, '');
                showStatus(`✅ SMS de perigo disparado. Próximo ciclo em 5 minutos.`, "#388e3c");
            } catch (error) {
                showStatus(`❌ Erro no ciclo de perigo: ${error.message}`, "#d32f2f");
            }
        }

        function openModal(mode) {
            const smsNumber = localStorage.getItem('excellington_sms');
            if (!smsNumber) {
                alert("Configure o número de SMS de emergência antes de usar.");
                return;
            }
            currentMode = mode;
            document.getElementById('modalTitle').innerText = mode === 'orange' ? "🟠 Alerta de Acidente" : "🟡 Alerta de Pane / Ataque";
            document.getElementById('additionalInfo').value = '';
            document.getElementById('voiceStatus').innerText = "Aguardando comando de voz.";
            document.getElementById('customModal').style.display = "flex";
        }

        function closeModal() {
            if (recognition) {
                recognition.stop();
            }
            document.getElementById('customModal').style.display = 'none';
        }

        function toggleVoiceTranscription() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }

            const status = document.getElementById('voiceStatus');
            const btn = document.getElementById('recordVoiceBtn');
            const textArea = document.getElementById('additionalInfo');

            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    status.innerHTML = `Ouvindo... <span class="recording-indicator">● REC</span>`;
                    btn.style.background = "#d32f2f";
                    btn.innerText = "⏹️ Parar Escuta";
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    textArea.value = transcript;
                    status.innerText = "Transcrição concluída com sucesso!";
                    btn.style.background = "#444";
                    btn.innerText = "🎙️ Ditar por Voz (Transcrição)";
                    recognition = null;
                };

                recognition.onerror = () => {
                    status.innerText = "Erro na captura de voz. Tente digitar.";
                    btn.style.background = "#444";
                    btn.innerText = "🎙️ Ditar por Voz (Transcrição)";
                    recognition = null;
                };

                recognition.onend = () => {
                    btn.style.background = "#444";
                    btn.innerText = "🎙️ Ditar por Voz (Transcrição)";
                    recognition = null;
                };

                recognition.start();
            } else {
                recognition.stop();
                recognition = null;
            }
        }

        async function sendCustomAlert() {
            closeModal();
            const smsNumber = localStorage.getItem('excellington_sms');
            const info = document.getElementById('additionalInfo').value.trim();
            const alertLabel = currentMode === 'orange' ? "acidente" : "pane";

            showStatus("Obtendo localização e preparando SMS...", "#f57c00");

            try {
                const locationUrl = await getLocation();
                sendSMS(smsNumber, currentMode, locationUrl, info);
                showStatus(`✅ Alerta de ${alertLabel} enviado com sucesso via SMS!`, "#388e3c");
            } catch (error) {
                showStatus(`❌ Erro ao enviar SMS: ${error.message}`, "#d32f2f");
            }
        }

        function sendSMS(number, type, locationUrl, voiceText) {
            const finalMessage = criarMensagemSMS(type, locationUrl, voiceText);
            const separator = /iPad|iPhone|iPod/.test(navigator.userAgent) ? '&' : '?';
            const url = `sms:${number}${separator}body=${encodeURIComponent(finalMessage)}`;
            window.location.href = url;
        }

        function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("Geolocalização não suportada pelo navegador."));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resolve(`https://maps.google.com/?q=${lat},${lon}`);
                    },
                    () => {
                        navigator.geolocation.getCurrentPosition(
                            position => {
                                const lat = position.coords.latitude;
                                const lon = position.coords.longitude;
                                resolve(`https://maps.google.com/?q=${lat},${lon}`);
                            },
                            () => reject(new Error("Não foi possível obter a localização. Verifique o GPS.")),
                            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
                        );
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }
    </script>
</body>
</html>
